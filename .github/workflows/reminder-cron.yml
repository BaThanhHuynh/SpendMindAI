name: SpendMindAI Scheduled Reminder Cron

on:
  schedule:
    # Runs every 15 minutes every day
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  trigger-cron:
    name: Dispatch System Web Push Reminders
    runs-on: ubuntu-latest
    steps:
      - name: Ping SpendMindAI System Cron
        run: |
          echo "Executing SpendMindAI Cron ping..."
          curl -s -f --max-time 20 "https://huynhbathanh.site/api/cron.php?token=safe_cron_token_2026" || echo "Cron ping completed with non-fatal status."
